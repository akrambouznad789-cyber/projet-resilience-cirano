[project]
name = "jumeau-cirano"
version = "0.1.0"
description = "Jumeau numérique du camionnage québécois : réseau à plusieurs routes par liaison, affectation calée et résilience"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Akram Bouznad" }]
dependencies = [
    "geopandas>=1.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "shapely>=2.0",
    "torch>=2.3",
]

[project.optional-dependencies]
# Suivi des essais de calibration (interface locale : mlflow ui)
suivi = ["mlflow>=2.12"]
# API du jumeau, pour l'application web officielle
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
jumeau = "jumeau_cirano.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jumeau_cirano"]

# PyTorch en version CPU : évite plusieurs Go de bibliothèques CUDA inutiles ici
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
